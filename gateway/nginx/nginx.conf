worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Giới hạn trung bình 10 request mỗi giây trên mỗi IP, không cho dồn request.
    limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=10r/s;

    upstream user_service {
        server user-service:8081;
        keepalive 16;
    }

    upstream order_service {
        server order-service:8082;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        limit_req_status 429;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # Gọi endpoint nội bộ để User Service kiểm tra chữ ký và thời hạn JWT.
        location = /_auth {
            internal;
            proxy_pass http://user_service/internal/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        # Khớp đường dẫn gốc và các đường dẫn con, tránh khớp nhầm như /users-admin.
        location = /users {
            limit_req zone=api_per_client;
            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /users/ {
            limit_req zone=api_per_client;
            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /dashboard/users/ {
            limit_req zone=api_per_client;
            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /orders {
            limit_req zone=api_per_client;
            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /orders/ {
            limit_req zone=api_per_client;
            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
