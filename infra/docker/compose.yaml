services:
  user-service:
    build:
      context: ../../services/user-service
    ports:
      - "127.0.0.1:8081:8081"

  order-service:
    build:
      context: ../../services/order-service
    ports:
      - "127.0.0.1:8082:8082"

  api-gateway:
    image: nginx:1.30.6-alpine3.24
    depends_on:
      - user-service
      - order-service
    ports:
      - "8080:80"
    volumes:
      - ../../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
