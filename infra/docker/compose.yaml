services:
  minio:
    build:
      context: ../../infra/minio
      args:
        MINIO_VERSION: ${MINIO_VERSION:-latest}
    image: btvn-minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before starting the stack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting the stack}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  user-service:
    build:
      context: ../../services/user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      ORDERS_BASE_URL: http://order-service:8082
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before starting the stack}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting the stack}
      MINIO_BUCKET: avatars
      MINIO_CORS_ORIGINS: ${MINIO_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      minio:
        condition: service_healthy

  order-service:
    build:
      context: ../../services/order-service
    ports:
      - "127.0.0.1:8082:8082"

  api-gateway:
    image: nginx:1.30.6-alpine3.24
    depends_on:
      - user-service
      - order-service
    ports:
      - "8080:80"
    volumes:
      - ../../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  minio_data:
